<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal trace at y=80, via gaps at x=60 and x=180 -->
    <line x1="0" y1="80" x2="52" y2="80"/>
    <line x1="68" y1="80" x2="172" y2="80"/>
    <line x1="188" y1="80" x2="240" y2="80"/>

    <!-- Horizontal trace at y=160, via gaps at x=60 and x=180 -->
    <line x1="0" y1="160" x2="52" y2="160"/>
    <line x1="68" y1="160" x2="172" y2="160"/>
    <line x1="188" y1="160" x2="240" y2="160"/>

    <!-- Vertical trace at x=60, via gaps at y=80 and y=160 -->
    <line x1="60" y1="0" x2="60" y2="72"/>
    <line x1="60" y1="88" x2="60" y2="152"/>
    <line x1="60" y1="168" x2="60" y2="240"/>

    <!-- Vertical trace at x=180, via gaps at y=80 and y=160 -->
    <line x1="180" y1="0" x2="180" y2="72"/>
    <line x1="180" y1="88" x2="180" y2="152"/>
    <line x1="180" y1="168" x2="180" y2="240"/>

    <!-- Vias at the four main intersections -->
    <circle cx="60" cy="80" r="5" fill="#000" stroke="none"/>
    <circle cx="180" cy="80" r="5" fill="#000" stroke="none"/>
    <circle cx="60" cy="160" r="5" fill="#000" stroke="none"/>
    <circle cx="180" cy="160" r="5" fill="#000" stroke="none"/>

    <!-- Branch: x=120 from top, right to x=180 at y=40 -->
    <line x1="120" y1="0" x2="120" y2="40"/>
    <line x1="120" y1="40" x2="180" y2="40"/>
    <circle cx="120" cy="40" r="4" fill="#000" stroke="none"/>
    <circle cx="180" cy="40" r="4" fill="#000" stroke="none"/>

    <!-- Branch: left edge y=120 into via, down to bottom -->
    <line x1="0" y1="120" x2="26" y2="120"/>
    <circle cx="30" cy="120" r="4" fill="#000" stroke="none"/>
    <line x1="30" y1="124" x2="30" y2="240"/>

    <!-- Branch: right edge y=120 into via, down to y=200 then right -->
    <line x1="240" y1="120" x2="214" y2="120"/>
    <circle cx="210" cy="120" r="4" fill="#000" stroke="none"/>
    <line x1="210" y1="124" x2="210" y2="196"/>
    <circle cx="210" cy="200" r="4" fill="#000" stroke="none"/>
    <line x1="214" y1="200" x2="240" y2="200"/>

    <!-- Small pad and stub at x=120, y=160 going down -->
    <circle cx="120" cy="160" r="3.5" fill="#000" stroke="none"/>
    <line x1="120" y1="163" x2="120" y2="240"/>
  </g>
</svg>
