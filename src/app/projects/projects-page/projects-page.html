<div class="page">
  <a class="back" routerLink="/">{{ strings().projects.backHome }}</a>

  <header class="head">
    <h1 class="title">{{ strings().projects.pageTitle }}</h1>
    <p class="subtitle">{{ strings().projects.pageSubtitle }}</p>
  </header>

  <app-project-filters
    class="filters"
    [category]="category()"
    (categoryChange)="onCategoryChange($event)" />

  <div class="content">
    @if (featured(); as f) {
      <app-featured-project [project]="f" />
    }
    <div class="grid">
      @for (project of others(); track project.slug) {
        <app-project-card [project]="project" />
      }
      <app-next-project-slot />
    </div>
  </div>
</div>
