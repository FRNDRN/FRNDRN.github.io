<mat-chip-listbox
  class="filters"
  [attr.aria-label]="strings().projects.filterAria"
  [value]="category()"
  (change)="onChange($event)">
  <mat-chip-option value="all">{{ strings().projects.all }}</mat-chip-option>
  @for (category of categories; track category) {
    <mat-chip-option [value]="category">{{ strings().projects.categories[category] }}</mat-chip-option>
  }
</mat-chip-listbox>
