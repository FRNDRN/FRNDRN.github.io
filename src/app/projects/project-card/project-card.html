<article class="card">
  @if (project(); as p) {
    @if (p.image !== null) {
      <div class="media">
        <img
          [ngSrc]="p.image.src"
          [alt]="p.image.alt"
          fill
          sizes="(min-width: 840px) 50vw, 100vw" />
      </div>
    }
    <div class="top">
      <p class="categories">{{ categoryLabel(p) }}</p>
      @if (p.status === 'in-progress') {
        <app-badge tone="secondary" [pulse]="true">{{ strings().projects.inProgress }}</app-badge>
      }
    </div>
    <h3 class="title">{{ p.title }}</h3>
    <p class="summary">{{ p.summary }}</p>
    @if (p.highlight !== null) {
      <p class="highlight">{{ p.highlight }}</p>
    }
    <app-tag-list
      class="stack"
      [tags]="p.stack"
      size="small"
      [ariaLabel]="strings().projects.stackAria" />
    <p class="origin">{{ p.origin }}</p>
  } @else {
    <div class="media media--placeholder" aria-hidden="true"><mat-icon svgIcon="photo" /></div>
    <div class="top">
      <app-skeleton width="120px" height="12px" />
    </div>
    <app-skeleton class="title" width="70%" height="24px" />
    <app-skeleton [lines]="2" height="16px" />
    <app-tag-list class="stack" size="small" />
    <app-skeleton class="origin" width="140px" height="14px" />
  }
</article>
