<article class="card">
  <span class="icon" aria-hidden="true">
    <mat-icon [svgIcon]="icon()" />
  </span>

  @if (item(); as it) {
    <p class="meta">{{ it.meta }}</p>
    <h3 class="title">{{ it.title }}</h3>
    @if (it.institution !== null) {
      <p class="institution">{{ it.institution }}</p>
    }
    @if (it.link !== null) {
      <a
        class="link"
        matButton="tonal"
        [href]="it.link.url"
        target="_blank"
        rel="noopener"
        [attr.aria-label]="it.link.label + ' ' + strings().common.opensInNewTab">
        {{ it.link.label }}
        <mat-icon svgIcon="external-link" iconPositionEnd />
      </a>
    }
  } @else {
    <app-skeleton class="meta" width="160px" height="13px" />
    <app-skeleton class="title" width="70%" height="24px" />
    <app-skeleton class="institution" width="50%" height="16px" />
  }
</article>
