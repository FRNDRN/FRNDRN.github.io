<section id="contact" class="contact" aria-labelledby="contact-title">
  <div class="inner">
    <div class="block">
      <app-section-header
        class="header"
        index="06"
        [name]="strings().sections.contact.overline"
        [title]="strings().sections.contact.title"
        headingId="contact-title"
        tone="on-primary-container" />

      <p class="lead">{{ strings().sections.contact.lead }}</p>

      <ul class="links">
        @if (profile(); as p) {
          <li>
            <a [href]="'mailto:' + p.links.email">
              <mat-icon svgIcon="mail" />
              <span>{{ p.links.email }}</span>
            </a>
          </li>
          <li>
            <a
              [href]="p.links.linkedin"
              target="_blank"
              rel="noopener"
              [attr.aria-label]="strings().hero.linkedin + ' ' + strings().common.opensInNewTab">
              <mat-icon svgIcon="linkedin" />
              <span>{{ strings().hero.linkedin }}</span>
            </a>
          </li>
          <li>
            <a
              [href]="p.links.github"
              target="_blank"
              rel="noopener"
              [attr.aria-label]="strings().hero.github + ' ' + strings().common.opensInNewTab">
              <mat-icon svgIcon="github" />
              <span>{{ strings().hero.github }}</span>
            </a>
          </li>
        } @else {
          @for (i of linkPlaceholders; track i) {
            <li class="link-skeleton">
              <app-skeleton shape="circle" width="22px" height="22px" />
              <app-skeleton width="200px" height="18px" />
            </li>
          }
        }
      </ul>

      @if (profile()?.links?.cv; as cv) {
        <a class="cv" matButton="filled" [href]="cv" download>
          {{ strings().contact.downloadCvPdf }}
        </a>
      }
    </div>
  </div>
</section>
