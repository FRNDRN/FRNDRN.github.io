<div class="inner">
  <a class="brand" routerLink="/" [attr.aria-label]="strings().common.home">
    <span class="monogram" aria-hidden="true">{{ monogram() }}</span>
    @if (name(); as n) {
      <span class="name">{{ n }}</span>
    } @else {
      <app-skeleton class="name" width="132px" height="20px" />
    }
  </a>

  <nav class="sections" [attr.aria-label]="strings().nav.sectionsAria">
    @for (item of items; track item.id) {
      <a
        class="pill"
        routerLink="/"
        [fragment]="item.id"
        [class.pill--active]="isActive(item.id)"
        [attr.aria-current]="ariaCurrent(item.id)">
        {{ strings().nav[item.id] }}
      </a>
    }
  </nav>

  <div class="controls">
    <app-language-toggle />
    <app-theme-toggle />
  </div>
</div>
